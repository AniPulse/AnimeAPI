<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Anime API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #e94560;
        --secondary: #7cdcfe;
        --accent: #ff7a8a;
        --dark: #0d0d1a;
        --darker: #0a0a14;
        --light: #f0f0f0;
        --gray: #2a2a2a;
        --card-bg: rgba(22, 33, 62, 0.7);
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Figtree", sans-serif;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
        color: var(--light);
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 80%, rgba(233, 69, 96, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(124, 220, 254, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(255, 122, 138, 0.05) 0%, transparent 50%);
        z-index: -1;
      }

      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header styling */
      header {
        background: rgba(13, 13, 26, 0.8);
        padding: 1.5rem 0;
        text-align: center;
        border-bottom: 2px solid var(--primary);
        box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
        position: relative;
        z-index: 10;
      }

      h1 {
        font-size: 2.5rem;
        background: linear-gradient(to right, var(--primary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        margin-bottom: 0.5rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 1.2rem;
        color: #a9b7c6;
        font-weight: 300;
      }

      .error-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .error-content {
        max-width: 800px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }

      .error-content:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .error-graphic {
        position: relative;
        margin-bottom: 2rem;
      }

      .error-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto;
        display: block;
        border: 4px solid var(--primary);
        box-shadow: 0 0 25px rgba(233, 69, 96, 0.7);
        animation: float 6s ease-in-out infinite;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        animation: glow 3s infinite alternate;
      }

      .error-title {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: var(--light);
      }

      .error-message {
        font-size: 1.2rem;
        color: #a9b7c6;
        margin-bottom: 2.5rem;
        line-height: 1.6;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .error-actions {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 30px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
      }

      .btn-primary {
        background: linear-gradient(90deg, var(--primary), var(--accent));
        color: white;
        box-shadow: 0 5px 15px rgba(233, 69, 96, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(233, 69, 96, 0.5);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--light);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-3px);
        color: var(--secondary);
      }

      /* Footer styling */
      footer {
        background: rgba(13, 13, 26, 0.9);
        padding: 2rem 0;
        text-align: center;
        border-top: 2px solid var(--primary);
        margin-top: auto;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 1.5rem;
      }

      .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        background: rgba(233, 69, 96, 0.2);
        border-radius: 50%;
        color: var(--primary);
        font-size: 1.5rem;
        transition: all 0.3s ease;
      }

      .social-links a:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-5px);
      }

      .copyright {
        color: #a9b7c6;
        font-size: 1rem;
      }

      /* Background elements for Darling In The Franxx theme */
      .franxx-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .franxx-element {
        position: absolute;
        opacity: 0.05;
      }

      .element-1 {
        top: 10%;
        left: 5%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
        border-radius: 50%;
      }

      .element-2 {
        bottom: 15%;
        right: 10%;
        width: 150px;
        height: 150px;
        background: conic-gradient(from 45deg, var(--primary), var(--accent), var(--primary));
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }

      .element-3 {
        top: 40%;
        right: 20%;
        width: 100px;
        height: 100px;
        background: linear-gradient(45deg, var(--primary), var(--accent));
        transform: rotate(45deg);
      }

      .floating-elements {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: -1;
      }

      .floating-element {
        position: absolute;
        opacity: 0.7;
        animation: float 15s infinite linear;
      }

      .floating-element:nth-child(1) {
        top: 10%;
        left: 10%;
        animation-delay: 0s;
        font-size: 2rem;
        color: var(--primary);
      }

      .floating-element:nth-child(2) {
        top: 20%;
        right: 15%;
        animation-delay: 2s;
        animation-duration: 12s;
        font-size: 3rem;
        color: var(--secondary);
      }

      .floating-element:nth-child(3) {
        bottom: 15%;
        left: 15%;
        animation-delay: 4s;
        animation-duration: 18s;
        font-size: 2.5rem;
        color: var(--accent);
      }

      .floating-element:nth-child(4) {
        bottom: 25%;
        right: 10%;
        animation-delay: 6s;
        animation-duration: 14s;
        font-size: 2rem;
        color: var(--primary);
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
        100% {
          transform: translateY(0) rotate(360deg);
        }
      }

      @keyframes glow {
        0% {
          text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        100% {
          text-shadow: 0 0 30px rgba(233, 69, 96, 0.5), 0 0 40px rgba(124, 220, 254, 0.3);
        }
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.2rem;
        }
        
        .error-code {
          font-size: 6rem;
        }
        
        .error-title {
          font-size: 2rem;
        }
        
        .error-content {
          padding: 2rem;
        }
        
        .error-actions {
          flex-direction: column;
          align-items: center;
        }
        
        .btn {
          width: 100%;
          max-width: 250px;
          justify-content: center;
        }
        
        .social-links {
          gap: 15px;
        }
        
        .social-links a {
          width: 45px;
          height: 45px;
          font-size: 1.3rem;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.8rem;
        }
        
        .subtitle {
          font-size: 1rem;
        }
        
        .error-code {
          font-size: 4rem;
        }
        
        .error-title {
          font-size: 1.5rem;
        }
        
        .error-message {
          font-size: 1rem;
        }
        
        .error-content {
          padding: 1.5rem;
        }
        
        .error-image {
          width: 150px;
          height: 150px;
        }
        
        .social-links {
          gap: 10px;
        }
        
        .social-links a {
          width: 40px;
          height: 40px;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Background elements -->
      <div class="franxx-bg">
        <div class="franxx-element element-1"></div>
        <div class="franxx-element element-2"></div>
        <div class="franxx-element element-3"></div>
      </div>
      
      <header>
        <h1>Anime API</h1>
        <p class="subtitle">RESTful API for Anime Data</p>
      </header>
      
      <div class="error-container">
        <div class="floating-elements">
          <div class="floating-element">❖</div>
          <div class="floating-element">✦</div>
          <div class="floating-element">❖</div>
          <div class="floating-element">✦</div>
        </div>
        
        <div class="error-content">        
          
          <h1 class="error-code">404</h1>
          <h2 class="error-title">Oops! Page Not Found</h2>
          
          <p class="error-message">
            It seems you've wandered into the void. The page you're looking for doesn't exist or has been moved.
            Don't worry, even the best explorers get lost sometimes!
          </p>
          
          <div class="error-actions">
            <a href="/" class="btn btn-primary">
              <i class="fas fa-home"></i>
              Return Home
            </a>
            <a href="https://github.com/Shineii86/AnimeAPI/issues/new" target="_blank" class="btn btn-secondary">
              <i class="fas fa-bug"></i>
              Report Problem
            </a>
          </div>
        </div>
      </div>
      
      <footer>
        <div class="copyright">
          &copy; <span id="currentYear"></span> Shinei Nouzen. All Rights Reserved.
        </div>
      </footer>
    </div>

    <script>
      // Update copyright year automatically
      document.getElementById('currentYear').textContent = new Date().getFullYear();
      
      // Add a subtle animation to the error code
      document.addEventListener('DOMContentLoaded', function() {
        const errorCode = document.querySelector('.error-code');
        
        // Pulsate the error code
        setInterval(() => {
          errorCode.style.transform = 'scale(1.05)';
          setTimeout(() => {
            errorCode.style.transform = 'scale(1)';
          }, 500);
        }, 2000);
        
        // Add floating animation to buttons on hover
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
          btn.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-3px)';
          });
          
          btn.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
          });
        });
      });
    </script>
  </body>
</html>
