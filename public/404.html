<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Anime API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #ff6b9d;
        --secondary: #8a4fff;
        --accent: #00e5ff;
        --dark: #121212;
        --darker: #0a0a0a;
        --light: #f0f0f0;
        --gray: #2a2a2a;
        --card-bg: rgba(30, 30, 30, 0.7);
        --transition: all 0.3s ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100%;
        width: 100%;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
        color: var(--light);
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 20% 80%, rgba(138, 79, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 107, 157, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
        z-index: -1;
      }

      .error-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .error-content {
        max-width: 800px;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }

      .error-content:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .error-graphic {
        position: relative;
        margin-bottom: 2rem;
      }

      .error-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto;
        display: block;
        border: 4px solid transparent;
        background: linear-gradient(45deg, var(--primary), var(--secondary)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: float 6s ease-in-out infinite;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
        animation: glow 3s infinite alternate;
      }

      .error-title {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: var(--light);
      }

      .error-message {
        font-size: 1.2rem;
        color: #aaa;
        margin-bottom: 2.5rem;
        line-height: 1.6;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .error-actions {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 30px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
      }

      .btn-primary {
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        color: white;
        box-shadow: 0 5px 15px rgba(138, 79, 255, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(138, 79, 255, 0.5);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--light);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-3px);
        color: var(--accent);
      }

      .floating-elements {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: -1;
      }

      .floating-element {
        position: absolute;
        opacity: 0.7;
        animation: float 15s infinite linear;
      }

      .floating-element:nth-child(1) {
        top: 10%;
        left: 10%;
        animation-delay: 0s;
        font-size: 2rem;
        color: var(--primary);
      }

      .floating-element:nth-child(2) {
        top: 20%;
        right: 15%;
        animation-delay: 2s;
        animation-duration: 12s;
        font-size: 3rem;
        color: var(--accent);
      }

      .floating-element:nth-child(3) {
        bottom: 15%;
        left: 15%;
        animation-delay: 4s;
        animation-duration: 18s;
        font-size: 2.5rem;
        color: var(--secondary);
      }

      .floating-element:nth-child(4) {
        bottom: 25%;
        right: 10%;
        animation-delay: 6s;
        animation-duration: 14s;
        font-size: 2rem;
        color: var(--primary);
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(180deg);
        }
        100% {
          transform: translateY(0) rotate(360deg);
        }
      }

      @keyframes glow {
        0% {
          text-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
        }
        100% {
          text-shadow: 0 0 30px rgba(138, 79, 255, 0.5), 0 0 40px rgba(0, 229, 255, 0.3);
        }
      }

      @media (max-width: 768px) {
        .error-code {
          font-size: 6rem;
        }
        
        .error-title {
          font-size: 2rem;
        }
        
        .error-content {
          padding: 2rem;
        }
        
        .error-actions {
          flex-direction: column;
          align-items: center;
        }
        
        .btn {
          width: 100%;
          max-width: 250px;
          justify-content: center;
        }
      }

      @media (max-width: 480px) {
        .error-code {
          font-size: 4rem;
        }
        
        .error-title {
          font-size: 1.5rem;
        }
        
        .error-message {
          font-size: 1rem;
        }
        
        .error-content {
          padding: 1.5rem;
        }
        
        .error-image {
          width: 150px;
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-content">        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        
        <p class="error-message">
          It seems you've wandered into the void. The page you're looking for doesn't exist or has been moved.
          Don't worry, even the best explorers get lost sometimes!
        </p>
        
        <div class="error-actions">
          <a href="/" class="btn btn-primary">
            <i class="fas fa-home"></i>
            Return Home
          </a>
          <a href="https://github.com/Shineii86/AnimeAPI/issues/new" target="_blank" class="btn btn-secondary">
            <i class="fas fa-bug"></i>
            Report Problem
          </a>
        </div>
      </div>

    <script>
      // Add a subtle animation to the error code
      document.addEventListener('DOMContentLoaded', function() {
        const errorCode = document.querySelector('.error-code');
        
        // Pulsate the error code
        setInterval(() => {
          errorCode.style.transform = 'scale(1.05)';
          setTimeout(() => {
            errorCode.style.transform = 'scale(1)';
          }, 500);
        }, 2000);
        
        // Add floating animation to buttons on hover
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
          btn.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-3px)';
          });
          
          btn.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
          });
        });
      });
    </script>
  </body>
</html>
